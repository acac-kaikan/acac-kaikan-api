services:
  db:
    image: postgres:16-alpine
    container_name: ${DB_CONTAINER_NAME:-acac-kaikan-db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kaikan}
      POSTGRES_USER: ${DB_USER:-kaikan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kaikan}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kaikan} -d ${DB_NAME:-kaikan}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: